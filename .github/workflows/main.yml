 name: Build Shailu Bhai APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify source
        shell: bash
        run: |
          set -e
          test -f index.html
          echo "index.html found."

      - name: Patch app logic
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path("index.html")
          s = p.read_text(encoding="utf-8")

          # ---------------------------------------------------------
          # HOME: Mark Unpaid must only target today's/current day
          # ---------------------------------------------------------
          old = 'lastTxnId: todaysOriginals.length ? todaysOriginals[0].id : null'

          new = '''lastTxnId: (todaysOriginals.find(function(t){
              return Number(t.dayNumber) === Number(s.currentDayNumber);
            }) || {}).id || null'''

          if old in s:
              s = s.replace(old, new, 1)
              print("Applied current-day Mark Unpaid fix.")
          else:
              print("Current-day Mark Unpaid patch already applied or source differs.")

          p.write_text(s, encoding="utf-8")

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Create Android project
        shell: bash
        run: |
          set -e

          mkdir -p app/src/main/java/com/shailubhai/app
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/res/values

          cp index.html app/src/main/assets/index.html

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "ShailuBhaiAPK"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.shailubhai.app'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.shailubhai.app'
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
              }
          }
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme"
                     parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#124B44</item>
                  <item name="android:statusBarColor">#124B44</item>
                  <item name="android:navigationBarColor">#000000</item>
                  <item name="android:windowLightStatusBar">false</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />

              <application
                  android:allowBackup="true"
                  android:hardwareAccelerated="true"
                  android:label="Shailu Bhai"
                  android:theme="@style/AppTheme">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

          cat > app/src/main/java/com/shailubhai/app/MainActivity.java <<'EOF'
          package com.shailubhai.app;

          import android.app.Activity;
          import android.content.ActivityNotFoundException;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Bundle;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {

              private WebView webView;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  webView = new WebView(this);
                  setContentView(webView);

                  WebSettings settings = webView.getSettings();

                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);

                  settings.setAllowFileAccess(true);
                  settings.setAllowContentAccess(true);
                  settings.setAllowFileAccessFromFileURLs(true);
                  settings.setAllowUniversalAccessFromFileURLs(true);

                  settings.setJavaScriptCanOpenWindowsAutomatically(true);
                  settings.setSupportMultipleWindows(false);

                  webView.setWebChromeClient(new WebChromeClient());

                  webView.setWebViewClient(new WebViewClient() {

                      @Override
                      public boolean shouldOverrideUrlLoading(
                              WebView view,
                              WebResourceRequest request) {
                          return handleUrl(request.getUrl().toString());
                      }

                      @Override
                      public boolean shouldOverrideUrlLoading(
                              WebView view,
                              String url) {
                          return handleUrl(url);
                      }
                  });

                  webView.loadUrl("file:///android_asset/index.html");
              }

              private boolean handleUrl(String url) {

                  if (url == null || url.isEmpty()) {
                      return true;
                  }

                  String lower = url.toLowerCase();

                  // Keep local app pages inside the WebView.
                  if (lower.startsWith("file:///android_asset/")) {
                      return false;
                  }

                  // -------------------------------------------------
                  // WHATSAPP DIRECT OPEN
                  // -------------------------------------------------
                  if (lower.startsWith("https://wa.me/")
                          || lower.startsWith("http://wa.me/")
                          || lower.startsWith("https://api.whatsapp.com/")
                          || lower.startsWith("http://api.whatsapp.com/")) {

                      try {
                          Uri webUri = Uri.parse(url);

                          String path = webUri.getPath();
                          String phone = "";

                          if (path != null) {
                              phone = path.replace("/", "").trim();
                          }

                          String text = webUri.getQueryParameter("text");

                          Uri.Builder waBuilder =
                                  Uri.parse("whatsapp://send").buildUpon();

                          if (phone != null && !phone.isEmpty()) {
                              waBuilder.appendQueryParameter("phone", phone);
                          }

                          if (text != null) {
                              waBuilder.appendQueryParameter("text", text);
                          }

                          Intent waIntent = new Intent(
                                  Intent.ACTION_VIEW,
                                  waBuilder.build()
                          );

                          waIntent.setPackage("com.whatsapp");
                          startActivity(waIntent);

                          // IMPORTANT:
                          // The wa.me webpage is never loaded.
                          return true;

                      } catch (ActivityNotFoundException e) {

                          // WhatsApp isn't installed.
                          // Only then open the normal wa.me URL externally.
                          try {
                              Intent browser = new Intent(
                                      Intent.ACTION_VIEW,
                                      Uri.parse(url)
                              );
                              startActivity(browser);
                          } catch (Exception ignored) {
                          }

                          return true;

                      } catch (Exception e) {
                          return true;
                      }
                  }

                  // Phone
                  if (lower.startsWith("tel:")) {
                      try {
                          startActivity(new Intent(
                                  Intent.ACTION_DIAL,
                                  Uri.parse(url)
                          ));
                      } catch (Exception ignored) {
                      }
                      return true;
                  }

                  // SMS
                  if (lower.startsWith("sms:")) {
                      try {
                          startActivity(new Intent(
                                  Intent.ACTION_VIEW,
                                  Uri.parse(url)
                          ));
                      } catch (Exception ignored) {
                      }
                      return true;
                  }

                  // Email
                  if (lower.startsWith("mailto:")) {
                      try {
                          startActivity(new Intent(
                                  Intent.ACTION_SENDTO,
                                  Uri.parse(url)
                          ));
                      } catch (Exception ignored) {
                      }
                      return true;
                  }

                  // Other external web pages.
                  if (lower.startsWith("http://")
                          || lower.startsWith("https://")) {

                      try {
                          Intent browser = new Intent(
                                  Intent.ACTION_VIEW,
                                  Uri.parse(url)
                          );
                          startActivity(browser);
                      } catch (Exception ignored) {
                      }

                      return true;
                  }

                  return false;
              }

              @Override
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }

              @Override
              protected void onDestroy() {
                  if (webView != null) {
                      webView.stopLoading();
                      webView.destroy();
                      webView = null;
                  }

                  super.onDestroy();
              }
          }
          EOF

      - name: Build Debug APK
        shell: bash
        run: |
          set -e
          gradle --no-daemon clean assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK="app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK"
          test -s "$APK"

          echo "APK successfully generated:"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Shailu-Bhai-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
